name: Workflow Lint

on:
  pull_request:
    paths:
      - '.github/workflows/**'
  push:
    branches: [main, develop]
    paths:
      - '.github/workflows/**'

jobs:
  actionlint:
    name: Validate GitHub Actions workflow files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Run actionlint
        uses: rhysd/actionlint@v1.7.12
        with:
          # Fail on syntax errors, undefined secret refs, and shellcheck issues in run: blocks
          flags: '-color'
