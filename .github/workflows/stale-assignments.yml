name: Stale Assignment Reclaimer

on:
  schedule:
    # Run daily at 00:00 UTC
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: write

jobs:
  stale-assignments:
    name: Reclaim abandoned issue assignments
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Reclaim stale assignments
        uses: actions/github-script@v7
        with:
          script: |
            const { Octokit } = require('@octokit/rest');
            const octokit = new Octokit({ auth: github.token });
            
            // Configuration (can be adjusted here)
            const WARNING_DAYS = 7;      // Days before warning comment
            const RECLAIM_DAYS = 14;     // Days before unassignment
            const WARNING_LABEL = 'stale-assignment-warning';
            const RECLAIM_LABEL = 'assignment-reclaimed';
            
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            
            // Get all open issues with assignees
            const issues = await octokit.rest.issues.listForRepo({
              owner,
              repo,
              state: 'open',
              assignee: '*',
              per_page: 100
            });
            
            const now = new Date();
            
            for (const issue of issues.data) {
              const assignees = issue.assignees.map(a => a.login);
              if (assignees.length === 0) continue;
              
              const assignedAt = new Date(issue.created_at);
              const updatedAt = new Date(issue.updated_at);
              const daysSinceUpdate = Math.floor((now - updatedAt) / (1000 * 60 * 60 * 24));
              const daysSinceAssignment = Math.floor((now - assignedAt) / (1000 * 60 * 60 * 24));
              
              // Check if there's a linked PR
              const hasLinkedPR = issue.body?.includes('Closes') || 
                                  issue.body?.includes('Fixes') || 
                                  issue.body?.includes('Resolves') ||
                                  issue.body?.includes('#');
              
              // Check if there are open PRs referencing this issue
              const prs = await octokit.rest.pulls.list({
                owner,
                repo,
                state: 'open',
                per_page: 100
              });
              
              const linkedPR = prs.data.find(pr => 
                pr.body?.includes(`#${issue.number}`) || 
                pr.title.includes(`#${issue.number}`)
              );
              
              // Skip if there's active PR activity
              if (linkedPR) {
                console.log(`Issue #${issue.number} has active PR #${linkedPR.number} - skipping`);
                continue;
              }
              
              // Check for existing labels
              const hasWarningLabel = issue.labels.some(l => l.name === WARNING_LABEL);
              const hasReclaimLabel = issue.labels.some(l => l.name === RECLAIM_LABEL);
              
              // Stage 1: Warning comment
              if (daysSinceUpdate >= WARNING_DAYS && !hasWarningLabel && !hasReclaimLabel) {
                const warningComment = "⚠️ **Stale Assignment Warning**\n\n" +
                  "This issue has been assigned to @" + assignees.join(', @') + " for " + daysSinceAssignment + " days with no linked PR activity for " + daysSinceUpdate + " days.\n\n" +
                  "To keep this assignment active, please:\n" +
                  "1. Open a draft PR if you're working on it\n" +
                  "2. Comment with an update on your progress\n" +
                  "3. Unassign yourself if you're no longer working on it\n\n" +
                  "If no activity is detected within " + (RECLAIM_DAYS - WARNING_DAYS) + " days, the assignment will be automatically removed to allow others to claim this issue.\n\n" +
                  "---\n" +
                  "*This is an automated message. Contact maintainers if you believe this is an error.*";
                
                await octokit.rest.issues.createComment({
                  owner,
                  repo,
                  issue_number: issue.number,
                  body: warningComment
                });
                
                await octokit.rest.issues.addLabels({
                  owner,
                  repo,
                  issue_number: issue.number,
                  labels: [WARNING_LABEL]
                });
                
                console.log("Added warning to issue #" + issue.number);
              }
              
              // Stage 2: Reclaim assignment
              if (daysSinceUpdate >= RECLAIM_DAYS && !hasReclaimLabel) {
                const reclaimComment = "🔄 **Assignment Reclaimed**\n\n" +
                  "This issue was previously assigned to @" + assignees.join(', @') + " but has shown no activity for " + daysSinceUpdate + " days.\n\n" +
                  "The assignment has been automatically removed to allow other contributors to claim this issue. If you were still working on it, please re-assign yourself and open a PR promptly.\n\n" +
                  "---\n" +
                  "*This is an automated message. Contact maintainers if you believe this is an error.*";
                
                await octokit.rest.issues.createComment({
                  owner,
                  repo,
                  issue_number: issue.number,
                  body: reclaimComment
                });
                
                // Remove all assignees
                await octokit.rest.issues.removeAssignees({
                  owner,
                  repo,
                  issue_number: issue.number,
                  assignees: assignees
                });
                
                // Update labels
                await octokit.rest.issues.removeLabel({
                  owner,
                  repo,
                  issue_number: issue.number,
                  name: WARNING_LABEL
                }).catch(() => {}); // Ignore if label doesn't exist
                
                await octokit.rest.issues.addLabels({
                  owner,
                  repo,
                  issue_number: issue.number,
                  labels: [RECLAIM_LABEL]
                });
                
                console.log("Reclaimed assignment for issue #" + issue.number);
              }
            }
