name: Mutation Testing

on:
  schedule:
    # Run mutation testing weekly on Monday at 2 AM UTC
    - cron: '0 2 * * 1'
  workflow_dispatch: # Allow manual triggering

jobs:
  mutation-testing:
    runs-on: ubuntu-latest
    name: Stryker Mutation Testing

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Stryker mutation testing
        run: npm run test:mutation
        continue-on-error: true

      - name: Upload mutation report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: mutation-report
          path: mutation-report/
          retention-days: 30

      - name: Comment on workflow with results
        if: always()
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const reportPath = 'mutation-report/index.html';
            if (fs.existsSync(reportPath)) {
              const content = fs.readFileSync(reportPath, 'utf8');
              // Extract key metrics if available
              console.log('Mutation testing completed. Report available in artifacts.');
            }
